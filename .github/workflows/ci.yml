name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build, audit
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit SHA, never a mutable
      # tag — a tag can be repointed at arbitrary code after review.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # `ci`, not `install`: installs exactly the lockfile and fails if
      # package.json and the lockfile disagree. `npm install` would silently
      # resolve a different tree than the one that was reviewed.
      - name: Install (locked)
        run: npm ci

      # typecheck and test are run as SEPARATE steps rather than via the
      # combined `npm run check` (typecheck && test), so a red build names
      # which one failed instead of just "check".
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The real build. Catches bundling/binding errors that tsc cannot see.
      # --dry-run builds and exits without touching the account, so this needs
      # no Cloudflare credentials and can never publish from CI.
      # Output goes to the runner's temp dir, not the working tree: `dist/`
      # is not gitignored in this repo, and CI must never leave build output
      # somewhere it could be committed by accident.
      - name: Build (wrangler dry-run — never deploys)
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/build"

      # Gate PRODUCTION dependencies at zero. The tree is currently clean, so
      # the gate starts honest rather than grandfathering a backlog.
      # --omit=dev keeps a devDependency advisory with no non-breaking fix from
      # wedging CI; dev findings are still printed below, just not fatal.
      - name: Audit production dependencies (must be zero)
        run: npm audit --omit=dev --audit-level=low

      - name: Audit dev dependencies (report only)
        run: npm audit || true
